
name: Daily jobs

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "index.html"
      - "config.yaml"
      - "fetch_jobs.py"
      - ".github/workflows/daily.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: jobs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python fetch_jobs.py

      - name: Save jobs.json to repo
        run: |
          git config user.name "jobs-bot"
          git config user.email "jobs-bot@users.noreply.github.com"
          git add jobs.json
          git diff --cached --quiet || (git commit -m "jobs update $(date -u +%F)" && git pull --rebase -q && git push)

      - name: Stage site
        run: mkdir _site && cp index.html jobs.json _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
