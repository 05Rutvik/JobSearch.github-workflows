name: job-tracker
on:
  schedule:
    - cron: "7 * * * *"      # hourly at :07
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [run, detect, notify-test]
        default: run
permissions:
  contents: write
concurrency:
  group: job-tracker
  cancel-in-progress: false
jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python tracker.py --mode "${{ github.event.inputs.mode || 'run' }}"
      - name: Save state
        if: always()
        run: |
          git config user.name "job-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          [ -f seen.json ] && git add seen.json || true
          git diff --cached --quiet || (git commit -m "update seen" && git pull --rebase && git push)
