# ===== EDIT ONLY THIS FILE to change what you see =====

# Search phrases sent to LinkedIn / Indeed / Naukri / Glassdoor / Google
searches:
  - Assortment Planning
  - Merchandise Financial Planning
  - o9 Solutions consultant
  - Retail Planning consultant
  - Demand Planning
  - Supply Chain Planning consultant
search_location: "Bengaluru, India"
results_per_search: 25        # per site per phrase
max_age_days: 14              # ignore jobs posted longer ago

# A job must contain one of these in its TITLE to be kept (regex, case-insensitive)
strong_keywords: ["assortment", "merchandis\\w* (financial )?plan", "\\bmfp\\b", "\\bo9\\b", "retail planning", "category planning", "allocation planning"]
good_keywords:   ["demand planning", "supply chain planning", "\\bplanning\\b", "planner", "forecast", "inventory", "replenishment", "functional consultant", "solution consultant", "implementation consultant"]
exclude_title: ["intern", "trainee", "apprentice", "\\bdirector\\b", "\\bvp\\b", "vice president", "\\bhead of\\b", "\\bchief\\b", "visual merchandis", "digital merchandis", "\\bbuying\\b", "\\bbuyer\\b", "store manager"]

# Preferred seniority words (small score bonus)
seniority_good: ["senior", "lead", "consultant", "manager", "specialist", "associate", "analyst"]

# Locations kept (regex). Jobs with no location are kept too.
locations: ["bengaluru", "bangalore", "remote", "hybrid", "india"]

# Companies you care about: get a score boost (any source)
priority_companies: ["o9", "ralph lauren", "kinaxis", "blue yonder", "anaplan", "oracle", "sap", "accenture", "deloitte", "pwc", "ey", "kpmg", "mckinsey", "bcg", "bain", "walmart", "target", "nike", "adidas", "levi", "h&m", "inditex", "lululemon", "tata", "reliance", "myntra", "flipkart", "amazon"]

# Which job boards to scrape (each one is optional; a blocked one just returns nothing)
boards: [linkedin, indeed, naukri, glassdoor, google]

# Direct company career pages (Greenhouse / Lever / Ashby / Workday links).
# Wrong or dead links never break the run; they only show a warning on the page.
# Add more by pasting the company's careers-board URL.
companies:
  - {name: "Anaplan", url: "https://boards.greenhouse.io/anaplan"}
  # - {name: "Some Lever Co",      url: "https://jobs.lever.co/company"}
  # - {name: "Some Ashby Co",      url: "https://jobs.ashbyhq.com/company"}
  # - {name: "Some Workday Co",    url: "https://company.wd5.myworkdayjobs.com/en-US/Careers"}
